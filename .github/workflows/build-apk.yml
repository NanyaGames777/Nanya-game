
name: Build NANYA GAMES APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract game project
        run: |
          unzip -q NANYA_GAMES_Trial_Bots_Project.zip
          cd NANYA_GAMES_Android_Project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NANYA-GAMES-debug-apk
          path: NANYA_GAMES_Android_Project/app/build/outputs/apk/debug/app-debug.apk
